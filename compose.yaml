services:
  signaling:
    build:
      context: ./server
    ports:
      - "4444:4444"
    environment:
      PORT: "4444"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4444/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  turn:
    image: coturn/coturn:4.6.3
    command:
      - --log-file=stdout
      - --min-port=49152
      - --max-port=49251
      - --lt-cred-mech
      - --user=cotab:cotab-dev
      - --realm=cotab.local
      - --external-ip=127.0.0.1
      - --no-cli
      - --fingerprint
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-49251:49152-49251/udp"

[package]
name = "cotab"
version = "0.1.0"
description = "CoTab desktop shell"
authors = ["CoTab contributors"]
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "cotab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
sha2 = "0.10"
url = "2"
reqwest = "0.13.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

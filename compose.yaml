services:
  collaboration:
    build:
      context: ./server
    ports:
      - "8787:8787"
    volumes:
      - collaboration-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  webdav:
    image: bytemark/webdav@sha256:21eed0df1238d17766080425f9ef46da2c1130e3e3aa9eaf36794d2a72e7c616
    platform: linux/amd64
    ports:
      - "6065:80"
    environment:
      AUTH_TYPE: Basic
      USERNAME: cotab
      PASSWORD: cotab-dev
      ANONYMOUS_METHODS: OPTIONS
    volumes:
      - ./tools/storage/webdav.apache.conf:/usr/local/apache2/conf/conf-enabled/cotab.conf:ro
    tmpfs:
      - /var/lib/dav/data

volumes:
  collaboration-data:

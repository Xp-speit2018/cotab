SetEnvIf Origin "^http://(localhost|127\.0\.0\.1):5173$" COTAB_CORS_ORIGIN=$0
FileETag MTime Size

<Location />
  SetEnv no-gzip 1
</Location>

Header always set Access-Control-Allow-Origin "%{COTAB_CORS_ORIGIN}e" env=COTAB_CORS_ORIGIN
Header always set Access-Control-Allow-Credentials "true" env=COTAB_CORS_ORIGIN
Header always set Access-Control-Allow-Headers "Authorization, Content-Type, If-Match, If-None-Match" env=COTAB_CORS_ORIGIN
Header always set Access-Control-Allow-Methods "DELETE, GET, HEAD, OPTIONS, PROPFIND, PUT" env=COTAB_CORS_ORIGIN
Header always set Access-Control-Expose-Headers "ETag" env=COTAB_CORS_ORIGIN
Header edit ETag "^W/" ""
